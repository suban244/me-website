# ---------------------------------------------------------------- publication
- kind: publication
  title: Extractive Nepali Question Answering System
  org: KEC Journal of Science and Engineering · Vol 9, No 1
  start: 2025-05-07
  precision: day
  url: https://doi.org/10.3126/kjse.v9i1.78368
  detail: Yunika Bajracharya, Suban Shrestha, Saurav Bastola, Sanjivan Satyal
  blurb: >-
    Built an extractive QA system for Nepali, with Nepali translations of
    SQuAD 1.1 and XQuAD for benchmarking. Translation-invariant tokens
    lifted span retention from 50% to 93%, and the best model reached 72.99
    EM / 84.13 F1 on XQuAD-Nepali. Datasets and code released publicly.

